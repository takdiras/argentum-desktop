name: Build and release

# - Pull requests and manual runs: run the checks and build every platform, publish nothing.
# - Pushing a tag like v0.1.0: the same, then attach the installers to a draft GitHub release.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BACKEND_URL: https://magic.wingedsheep.com

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${app_version} in src-tauri/tauri.conf.json" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Fetches the pinned upstream web-client, applies patches/, copies overlay/ in.
      - name: Prepare vendored web client
        run: bun run prepare:web

      - name: Overlay tests
        working-directory: vendor/argentum-engine/web-client
        run: bunx --bun vitest run src/desktop

      - name: Typecheck
        working-directory: vendor/argentum-engine/web-client
        run: bun run typecheck

  build:
    name: Build (${{ matrix.name }})
    needs: check
    permissions:
      contents: write # create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      # `tauri build` runs `npm run build:web` as its beforeBuildCommand, which needs vendor/ in place
      # and BACKEND_URL set (see the workflow-level env). Without BACKEND_URL the bundle would be a
      # same-origin build that cannot reach the server.
      - name: Prepare vendored web client
        shell: bash
        run: bun run ensure:web

      # Tag builds also produce the signed update bundles and latest.json that installed apps check
      # (see src-tauri/tauri.updater.conf.json). PRs and manual runs skip that, so they need no secret.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}${{ startsWith(github.ref, 'refs/tags/v') && ' --config src-tauri/tauri.updater.conf.json' || '' }}
          # Setting tagName is what makes the action publish; on PRs and manual runs it only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Argentum Desktop ${{ github.ref_name }}
          releaseBody: See the assets below to download the installer for your platform. The installers are not code-signed. Installed apps update themselves from the latest published (non-draft) release.
          releaseDraft: true
          prerelease: false
