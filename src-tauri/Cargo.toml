[package]
name = "argentum-desktop"
version = "0.2.0"
description = "Tauri desktop client for Argentum Engine"
edition = "2021"
license = "MIT"

[lib]
name = "argentum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["gzip", "brotli", "deflate"] }
