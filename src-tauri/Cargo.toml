[package]
name = "argentum-desktop"
version = "0.3.1"
description = "Tauri desktop client for Argentum Engine"
edition = "2021"
license = "MIT"

[lib]
name = "argentum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["gzip", "brotli", "deflate"] }

# Self-update is desktop-only; these crates do not build for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
